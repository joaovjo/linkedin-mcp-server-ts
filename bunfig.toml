[publish]
# The registry to publish to
registry = "https://registry.npmjs.org/"

# The access level to publish with
access = "public"

[test]
# Test discovery & execution root
root = "."

# Coverage configuration
coverage = true
coverageReporter = ["text", "lcov"]
coverageThreshold = { line = 90, function = 90, branch = 90 }
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "tests/**",
  "node_modules/**"
]
