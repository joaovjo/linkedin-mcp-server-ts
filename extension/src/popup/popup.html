<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LinkedIn MCP Bridge</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 16px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 13px; line-height: 1.4; }
    .status { padding: 8px; border-radius: 6px; margin: 12px 0; font-size: 13px; }
    .connected { background: #e6f4ea; color: #137333; }
    .disconnected { background: #fce8e6; color: #c5221f; }
    button { padding: 8px 12px; margin-right: 8px; cursor: pointer; }
    code { background: #f1f3f4; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>LinkedIn MCP Bridge</h1>
  <p>Connects this browser to the local LinkedIn MCP server bridge.</p>
  <div id="status" class="status disconnected">Disconnected</div>
  <div>
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
  </div>
  <p style="margin-top:12px;">Bridge URL: <code id="url">ws://127.0.0.1:8765</code></p>
  <p>Start the server with <code>BRIDGE_ENABLED=true bun run src/index.ts</code>, then click Connect.</p>
  <script src="popup.js"></script>
</body>
</html>
